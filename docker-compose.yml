services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  
  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/appdb?sslmode=disable
      HTTP_ADDR: ":8080"
      BASE_URL: ${BASE_URL}
    ports:
      # Remap 80 port to 8080 for dev environment
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
        restart: true

volumes:
  postgres_data:
